
services:

  # =========================
  # SPARK MASTER
  # =========================
  spark-master:
    image: apache/spark:3.5.3
    container_name: airwatch-spark-master
    hostname: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - airwatch-network
    restart: unless-stopped

  # =========================
  # SPARK WORKER 1
  # =========================
  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: airwatch-spark-worker-1
    hostname: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 1g
      - --webui-port
      - "8081"
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    networks:
      - airwatch-network
    restart: unless-stopped

  # =========================
  # SPARK WORKER 2
  # =========================
  spark-worker-2:
    image: apache/spark:3.5.3
    container_name: airwatch-spark-worker-2
    hostname: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 1g
      - --webui-port
      - "8081"
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    networks:
      - airwatch-network
    restart: unless-stopped

  # =========================
  # HDFS NAMENODE
  # =========================
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: airwatch-namenode
    hostname: namenode
    environment:
      CLUSTER_NAME: airwatch
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "2"
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
    networks:
      - airwatch-network
    restart: unless-stopped

  # =========================
  # HDFS DATANODE 1
  # =========================
  datanode-1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: airwatch-datanode-1
    hostname: datanode-1
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "2"
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - datanode1_data:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - airwatch-network
    restart: unless-stopped

  # =========================
  # HDFS DATANODE 2
  # =========================
  datanode-2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: airwatch-datanode-2
    hostname: datanode-2
    environment:
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "2"
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - datanode2_data:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - airwatch-network
    restart: unless-stopped

  # -------------------------
  # KAFKA BROKER
  # -------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: airwatch-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - airwatch-network

    restart: unless-stopped    

# =========================
# NETWORK
# =========================
networks:
  airwatch-network:
    driver: bridge

# =========================
# PERSISTENT VOLUMES
# =========================
volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:
  kafka_data: